:root{--bg:#0a0d1f;--panel:#121736;--panel2:#1a2050;--line:#2a3170;--fg:#f2f0e6;--muted:#9aa0c8;--accent:#ffcb05;--red:#e3350d;--blue:#3b6fd8;--good:#21d07a;--pixel:'Press Start 2P',ui-monospace,monospace}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#leaders line{stroke:#f2f0e6;stroke-width:1;opacity:.8}
.callout{position:absolute;left:0;top:0;pointer-events:none;background:rgba(10,13,31,.88);border:1px solid var(--line);border-radius:.25rem;padding:.12rem .4rem;font-size:.95rem;line-height:1.15;white-space:nowrap;color:var(--fg)}
.callout b{color:var(--muted);font-weight:600;margin-right:.3rem;font-size:.8rem;letter-spacing:.04em}
.panel{position:absolute;background:rgba(18,23,54,.97);border:1px solid var(--line);border-radius:.5rem;padding:.6rem .8rem}
.panel h2{font-size:.8rem;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:.35rem;text-transform:uppercase}

#top{position:absolute;left:1rem;top:.8rem;display:flex;align-items:baseline;gap:.8rem}
#title{font-family:var(--pixel);font-size:1.05rem;letter-spacing:.02em;white-space:nowrap;font-weight:400}
.poke{color:var(--accent);text-shadow:.06em .06em 0 var(--blue),.12em .12em 0 #0b1a46}
.jam{color:var(--fg);text-shadow:.06em .06em 0 var(--red),.12em .12em 0 #4a0d04}
#title .rest{color:var(--fg);margin-left:.5em;font-size:.8em}
#mode-chip{font-size:.95rem;color:var(--muted);white-space:nowrap}
#mode-chip button{font:inherit;color:var(--accent);background:none;border:1px solid var(--line);border-radius:.25rem;padding:.08rem .45rem;margin-left:.4rem;cursor:pointer}

#cams{position:absolute;right:1rem;top:.6rem;display:flex;gap:.3rem}
.btn{font:inherit;font-weight:700;font-size:1rem;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:.3rem;padding:.3rem .7rem;cursor:pointer;white-space:nowrap;line-height:1.1}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#1a1400}
.btn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:1px}

#free{position:absolute;left:21.6rem;right:21.6rem;top:5.6rem;bottom:15.4rem;pointer-events:none}
#caption{position:absolute;left:21.6rem;right:21.6rem;top:3.5rem;text-align:center;font-size:1.25rem;line-height:1.2;color:var(--fg);pointer-events:none}
#caption span{display:inline-block;background:rgba(10,13,31,.9);border-radius:.3rem;padding:.1rem .6rem}
.compact #caption span{padding:.02rem .4rem}
.gauge .lab .mk{color:var(--muted)}
.gauge .val .mk{display:none}
.compact .gauge .val .mk{display:inline;font-size:.62em;margin-left:.2em}
.compact .gauge .lab .mkl{display:none}
#result{position:absolute;left:21.6rem;right:21.6rem;bottom:15.7rem;text-align:center;pointer-events:none;font-size:1.25rem;line-height:1.15}
#result span{display:inline-block;background:rgba(10,13,31,.92);border:1px solid var(--line);border-radius:.3rem;padding:.15rem .7rem}
#result b{font-weight:800}

#tabs{display:none}
#aim{left:1rem;top:3.4rem;width:20rem;height:21.6rem}
#player{left:1rem;top:25.4rem;width:20rem;bottom:5.2rem}
#shoot{position:absolute;left:1rem;width:20rem;bottom:1rem;height:3.8rem;font:inherit;font-weight:800;font-size:1.7rem;letter-spacing:.06em;color:#1a1400;background:var(--accent);border:0;border-radius:.5rem;cursor:pointer}
#shoot:hover{background:#ffd83d}
#shoot small{font-size:.9rem;font-weight:700;letter-spacing:0;margin-left:.5rem;opacity:.75}
#gauges{right:1rem;top:3.4rem;width:20rem;height:23rem;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:12.6rem 1fr;gap:.2rem .5rem}
.gauge{position:relative;display:flex;align-items:center;justify-content:center}
.gauge canvas{position:absolute;inset:0;width:100%;height:100%}
.gauge .val{position:relative;font-weight:800;font-size:1.9rem;line-height:1;text-align:center;margin-top:-.2rem}
.gauge .val small{font-size:.55em;font-weight:700;color:var(--muted);margin-left:.05em}
.gauge .lab{position:absolute;left:0;right:0;bottom:.05rem;text-align:center;font-size:.85rem;letter-spacing:.08em;color:var(--muted);font-weight:700}
#g-make{grid-column:1 / span 2}
#g-make .val{font-size:3.6rem}
#g-make .lab{bottom:.2rem;font-size:1.05rem;letter-spacing:.05em}
#math{right:1rem;top:27rem;width:20rem;bottom:1rem;font-size:1rem;line-height:1.25;overflow:hidden}
#read{display:grid;grid-template-columns:1fr auto;gap:.02rem .5rem;margin-bottom:.45rem;font-size:1.05rem}
#read span:nth-child(odd){color:var(--muted)}
#read span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
#steps{border-top:1px solid var(--line);padding-top:.4rem;font-variant-numeric:tabular-nums}
#steps div{display:flex;justify-content:space-between;gap:.5rem}
#steps div span:first-child{color:var(--muted)}
#steps .tot{color:var(--fg);font-weight:800;border-top:1px solid var(--line);margin-top:.2rem;padding-top:.15rem}
#steps .tot span:first-child{color:var(--fg)}
#steps .src{display:block;color:var(--muted);font-size:.85rem;margin-top:.25rem}
#note{color:var(--accent);margin-top:.3rem;font-size:.95rem;line-height:1.15}

#c-arc-wrap{left:21.6rem;right:45.4rem;bottom:1rem;height:14rem;padding:.4rem .5rem}
#c-time-wrap{right:21.6rem;width:23rem;bottom:1rem;height:14rem;padding:.4rem .5rem}
.chart-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}

.row{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:0 .4rem;margin-bottom:.32rem;font-size:1rem}
.row .lb{color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.row output{font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.row input{grid-column:1 / span 2;width:100%;height:1.15rem;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none}
.row input::-webkit-slider-runnable-track{height:.42rem;border-radius:.21rem;background:var(--track,#2f3560)}
.row input::-moz-range-track{height:.42rem;border-radius:.21rem;background:var(--track,#2f3560)}
.row input::-webkit-slider-thumb{-webkit-appearance:none;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--fg);border:.14rem solid #0a0d1f;margin-top:-.32rem}
.row input::-moz-range-thumb{width:.8rem;height:.8rem;border-radius:50%;background:var(--fg);border:.14rem solid #0a0d1f}
.row.off{opacity:.45}
.chip{font-style:normal;font-size:.72rem;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);border-radius:.2rem;padding:0 .22rem;margin-left:.25rem;color:var(--muted);vertical-align:.08em}
.chip.sim{color:var(--accent);border-color:var(--accent)}
.seg{display:flex;gap:.25rem;margin-bottom:.42rem;flex-wrap:wrap}
.seg .btn{flex:1 1 auto;padding:.26rem .3rem;font-size:.95rem;text-align:center}

#cursor{position:absolute;left:0;top:0;width:1.6rem;height:1.6rem;pointer-events:none;display:none;z-index:5;filter:drop-shadow(0 1px 2px #000)}
#cursor i{position:absolute;left:-.9rem;top:-.9rem;width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid var(--accent);opacity:0}
#cursor.press i{opacity:1}
#rotate{display:none}

/* Compact: phones in landscape and anything small. Same parts, rearranged. */
.compact #title{font-family:inherit;font-weight:800;font-size:.95rem;letter-spacing:.01em}
.compact #title .poke,.compact #title .jam{text-shadow:none}
.compact #title .rest{margin-left:.3em;font-size:1em}
.compact #top{left:auto;right:.3rem;top:.12rem;width:17.4rem;display:block}
.compact #mode-chip{display:none}
.compact #tabs{display:flex;position:absolute;right:.3rem;top:1.42rem;width:17.4rem;gap:.2rem}
.compact #tabs .btn{flex:1;font-size:.9rem;padding:.2rem 0;height:1.65rem}
.compact .panel{padding:.3rem .45rem;border-radius:.3rem}
.compact .panel h2{display:none}
.compact #aim,.compact #player,.compact #math{left:auto;right:.3rem;width:17.4rem;top:3.15rem;bottom:3rem;height:auto}
.compact #aim,.compact #player,.compact #math,.compact #c-time-wrap{display:none}
.compact[data-tab=aim] #aim,.compact[data-tab=player] #player{display:block}
.compact[data-tab=math] #math{display:block;top:9.6rem;overflow-y:auto;font-size:.82rem;line-height:1.14}
.compact[data-tab=math] #c-time-wrap{display:block;right:.3rem;width:17.4rem;top:3.15rem;height:6.3rem;bottom:auto;padding:0}
.compact #read{font-size:.82rem;margin-bottom:.2rem}
.compact #steps{padding-top:.2rem}
.compact #steps .src{font-size:.72rem;margin-top:.1rem}
.compact #note{font-size:.76rem;margin-top:.1rem}
.compact #shoot{left:auto;right:.3rem;width:17.4rem;bottom:.3rem;height:2.5rem;font-size:1.25rem;border-radius:.3rem}
.compact #shoot small{display:none}
.compact #cams{right:18rem;left:auto;top:.28rem;gap:.15rem}
.compact #cams .btn{font-size:.82rem;padding:0 .32rem;height:2.5rem;border-radius:.25rem}
.compact #gauges{left:.3rem;right:auto;top:.28rem;width:18.4rem;height:2.5rem;display:flex;gap:.15rem;padding:0;background:none;border:0}
.compact .gauge{flex:1 1 0;background:rgba(18,23,54,.97);border:1px solid var(--line);border-radius:.25rem;justify-content:flex-start;padding-left:2.25rem}
.compact .gauge canvas{inset:auto;left:.1rem;top:.1rem;width:2.2rem;height:2.2rem}
.compact .gauge .val,.compact #g-make .val{font-size:1.1rem;margin-top:.72rem;white-space:nowrap}
.compact .gauge .val small{font-size:.68em}
.compact .gauge .lab,.compact #g-make .lab{left:2.25rem;right:auto;top:.1rem;bottom:auto;font-size:.68rem;letter-spacing:.02em;text-align:left;white-space:nowrap}
.compact #g-make{flex:0 0 7rem}
.compact #g-angle{flex:0 0 4.9rem}
.compact #g-power{flex:1 1 0}
.compact #free{left:.3rem;right:18rem;top:4.2rem;bottom:7.05rem}
.compact #caption{left:.4rem;right:18.1rem;top:2.86rem;font-size:.88rem;line-height:1.05;min-height:0}
.compact #result{left:.3rem;right:18rem;bottom:5.65rem;font-size:.85rem;line-height:1.05}
.compact #result span{padding:.05rem .4rem}
.compact #c-arc-wrap{left:.3rem;right:18rem;bottom:.3rem;height:5.2rem;padding:0;border-radius:.3rem}
.compact .row{margin-bottom:.02rem;font-size:.82rem}
.compact .row output{font-size:.92rem}
.compact .row input{height:1.05rem}
.compact .chip{font-size:.62rem}
.compact .seg{margin-bottom:.15rem;gap:.15rem}
.compact .seg .btn{font-size:.8rem;padding:.1rem .15rem;height:1.45rem}
.compact .callout{font-size:.74rem;padding:.02rem .25rem}
.compact .callout b{font-size:.64rem;margin-right:.18rem}
.compact #cursor{width:1.25rem;height:1.25rem}
.portrait #app{height:24.375rem}
.portrait #rotate{display:block;position:absolute;left:0;right:0;top:25rem;text-align:center;font-size:1rem;color:var(--muted)}
.portrait #cams .btn{padding:0 .12rem;letter-spacing:-.02em}
.portrait #cams{gap:.05rem;right:17.85rem}
.portrait #gauges{width:17.6rem}

</style>
